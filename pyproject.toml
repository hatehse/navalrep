[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "navalrep"
version = "0.1.0"
description = "Sequential, offline Spanish cliffhanger clip pipeline for an 8 GB NVIDIA GPU"
requires-python = ">=3.10,<3.14"
dependencies = [
  "faster-whisper>=1.1,<2",
  "scenedetect>=0.6.4,<0.7",
  "opencv-python-headless>=4.9,<5",
  "librosa>=0.10.2,<0.12",
  "soundfile>=0.12,<0.14",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.5,<3",
]

[project.scripts]
navalrep = "navalrep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
