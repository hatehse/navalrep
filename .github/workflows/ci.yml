name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg and subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip check

      - name: Check Python syntax and CLI entry point
        run: |
          python -m compileall -q main_pipeline.py src scripts tests
          python -m navalrep --help

      - name: Run all tests without skips
        # Synthetic CPU media tests validate filters and timing. No model is
        # downloaded, and CUDA inference/NVENC hardware are not tested here.
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/run_ci.py
